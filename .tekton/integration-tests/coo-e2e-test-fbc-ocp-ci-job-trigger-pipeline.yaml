---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  annotations:
    pipelinesascode.tekton.dev/task: "[coo-e2e-tests]"
  name: coo-e2e-test-fbc
spec:
  description: |
    This pipeline automates the process of running e2e tests for Cluster Observability Operator. The pipeline fetches the FBC fragment image and
    passes it as a parameter to the OpenShift CI job using Gangway API.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'coo-e2e-test-fbc'
      type: string
    - name: gangway_api_url
      description: 'URL for the Gangway API'
      default: 'https://gangway-ci.apps.ci.l2s4.p1.openshiftapps.com'
      type: string
    - name: ocp_ci_job_name
      description: 'OpenShift CI job name'
      type: string
    - name: multistage_param_override_key
      description: 'The key name for the multistage parameter override (e.g., MULTISTAGE_PARAM_OVERRIDE_COO_INDEX_IMAGE)'
      type: string
  tasks:
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test-metadata/0.3/test-metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
    - name: coo-e2e-tests
      description: Task to run tests from service repository
      runAfter:
        - parse-metadata
      when:
        - input: $(tasks.parse-metadata.results.test-event-type)
          operator: in
          values: ["push", "Push", "PUSH"]
      params:
        - name: GANGWAY_API_URL
          value: $(params.gangway_api_url)
        - name: OCP_CI_JOB_NAME
          value: $(params.ocp_ci_job_name)
        - name: FBC_FRAGMENT
          value: "$(tasks.parse-metadata.results.container-image)"
        - name: MULTISTAGE_PARAM_OVERRIDE_KEY
          value: "$(params.multistage_param_override_key)"
      taskSpec:
        params:
          - name: GANGWAY_API_URL
            type: string
          - name: OCP_CI_JOB_NAME
            type: string
          - name: FBC_FRAGMENT
            type: string
          - name: MULTISTAGE_PARAM_OVERRIDE_KEY
            type: string
        volumes:
          - name: credentials
            emptyDir: {}
          - name: gangway-api-token
            secret:
              secretName: gangway-api-token
        steps:
          - name: run-e2e-tests
            env:
              - name: FBC_FRAGMENT
                value: "$(params.FBC_FRAGMENT)"
              - name: GANGWAY_API_URL
                value: "$(params.GANGWAY_API_URL)"
              - name: OCP_CI_JOB_NAME
                value: "$(params.OCP_CI_JOB_NAME)"
              - name: MULTISTAGE_PARAM_OVERRIDE_KEY
                value: "$(params.MULTISTAGE_PARAM_OVERRIDE_KEY)"
            volumeMounts:
              - name: credentials
                mountPath: /credentials
              - name: gangway-api-token
                mountPath: /secrets/gangway-api-token
                readOnly: true
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -o pipefail

              echo "Install dependencies"
              dnf -y install jq

              # Read the token from the secret file
              GANGWAY_API_TOKEN=$(cat /secrets/gangway-api-token/gangway_api_token)

              # Tunables for resiliency against transient Gangway/network errors.
              # The Gangway API is occasionally flaky, especially when many FBC
              # integration tests fire simultaneously from a single nudge. Without
              # retries a single transient blip fails the whole integration test.
              TRIGGER_MAX_ATTEMPTS=${TRIGGER_MAX_ATTEMPTS:-5}
              TRIGGER_RETRY_DELAY=${TRIGGER_RETRY_DELAY:-15}
              POLL_MAX_ATTEMPTS=${POLL_MAX_ATTEMPTS:-60}
              POLL_RETRY_DELAY=${POLL_RETRY_DELAY:-5}

              # curl options shared by all requests:
              #  --retry/--retry-connrefused/--retry-all-errors handle low level
              #  network transients; we still layer application level retries on top
              #  to handle valid HTTP responses that lack the expected fields.
              CURL_COMMON=(--silent --show-error --location
                --connect-timeout 15 --max-time 60
                --retry 3 --retry-delay 3 --retry-connrefused --retry-all-errors)

              echo "Create the JSON payload dynamically with the configurable key"
              JSON_PAYLOAD=$(jq -n \
                --arg key "${MULTISTAGE_PARAM_OVERRIDE_KEY}" \
                --arg value "${FBC_FRAGMENT}" \
                '{
                  "job_execution_type": "1",
                  "pod_spec_options": {
                    "envs": {
                      ($key): $value
                    }
                  }
                }')

              echo "JSON payload:"
              echo "${JSON_PAYLOAD}"

              # ---------------------------------------------------------------
              # Step 1: Trigger the OpenShift CI job (with retries)
              # ---------------------------------------------------------------
              JOB_ID=""
              ATTEMPT=1
              while [ ${ATTEMPT} -le ${TRIGGER_MAX_ATTEMPTS} ]; do
                echo "Triggering OpenShift CI job (attempt ${ATTEMPT}/${TRIGGER_MAX_ATTEMPTS})..."

                HTTP_BODY_FILE=$(mktemp)
                HTTP_CODE=$(curl "${CURL_COMMON[@]}" \
                  -o "${HTTP_BODY_FILE}" -w "%{http_code}" \
                  -X POST -d "${JSON_PAYLOAD}" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${GANGWAY_API_TOKEN}" \
                  "${GANGWAY_API_URL}/v1/executions/${OCP_CI_JOB_NAME}") || HTTP_CODE="000"
                RESPONSE=$(cat "${HTTP_BODY_FILE}")
                rm -f "${HTTP_BODY_FILE}"

                echo "HTTP status: ${HTTP_CODE}"
                echo "Job trigger response:"
                echo "${RESPONSE}"

                if [ "${HTTP_CODE}" -ge 200 ] 2>/dev/null && [ "${HTTP_CODE}" -lt 300 ] 2>/dev/null; then
                  JOB_ID=$(echo "${RESPONSE}" | jq -r '.id // empty')
                  if [ -n "${JOB_ID}" ] && [ "${JOB_ID}" != "null" ]; then
                    echo "Job triggered successfully. Job ID: ${JOB_ID}"
                    break
                  fi
                  echo "Response did not contain a job id."
                else
                  echo "Non-success HTTP status from Gangway."
                fi

                if [ ${ATTEMPT} -eq ${TRIGGER_MAX_ATTEMPTS} ]; then
                  echo "Failed to trigger job after ${TRIGGER_MAX_ATTEMPTS} attempts (job: ${OCP_CI_JOB_NAME})"
                  exit 1
                fi
                echo "Retrying in ${TRIGGER_RETRY_DELAY}s..."
                sleep ${TRIGGER_RETRY_DELAY}
                ATTEMPT=$((ATTEMPT + 1))
              done

              # ---------------------------------------------------------------
              # Step 2: Poll for the job URL (confirms the job was scheduled)
              # ---------------------------------------------------------------
              echo "Fetching job details for ID: ${JOB_ID}"
              ATTEMPT=0
              JOB_URL=""
              while [ ${ATTEMPT} -lt ${POLL_MAX_ATTEMPTS} ]; do
                echo "Attempt $((ATTEMPT + 1))/${POLL_MAX_ATTEMPTS}: Fetching job details..."

                JOB_DETAILS=$(curl "${CURL_COMMON[@]}" \
                  -X GET -H "Authorization: Bearer ${GANGWAY_API_TOKEN}" \
                  "${GANGWAY_API_URL}/v1/executions/${JOB_ID}") || JOB_DETAILS=""
                echo "Job details response:"
                echo "${JOB_DETAILS}"

                JOB_URL=$(echo "${JOB_DETAILS}" | jq -r '.job_url // empty' 2>/dev/null)

                if [ -n "${JOB_URL}" ] && [ "${JOB_URL}" != "null" ]; then
                  echo "Job URL found: ${JOB_URL}"
                  break
                fi

                echo "Job URL not yet available, waiting ${POLL_RETRY_DELAY} seconds..."
                sleep ${POLL_RETRY_DELAY}
                ATTEMPT=$((ATTEMPT + 1))
              done

              if [ -z "${JOB_URL}" ] || [ "${JOB_URL}" = "null" ]; then
                echo "Job URL not available after ${POLL_MAX_ATTEMPTS} attempts"
                exit 1
              fi

              echo "Final job details with URL:"
              echo "${JOB_DETAILS}"